apiVersion: apps/v1
kind: Deployment
metadata:
  name: <PROJECT>
  namespace: default
  labels:
    app: <PROJECT>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <PROJECT>
  template:
    metadata:
      labels:
        app: <PROJECT>
    spec:
      containers:
      - name: <PROJECT>
        image: <IMAGE>
        resources:
          limits:
            cpu: "1"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        ports:
        - containerPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: <PROJECT>
  namespace: default
spec:
  type: NodePort
  selector:
    app: <PROJECT>
  ports:
    - protocol: TCP
      nodePort: 30044
      targetPort: 8086
      port: 8086
